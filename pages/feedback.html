  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Feedback.css">
</head>
<body>
  <div id="navbar-placeholder"></div>
      Dear esteemed customer, kindly rate us
    </div>
    <div class="post">
      <div class="edit">EDIT</div>
    </div>
    <div class="star-widget">
      <div class="stars-container">
      </div>
      <form action="feedback.php" id="feedbackForm" method="post" onsubmit="return validateForm()">
        <header></header>
        <input type="hidden" name="rating" id="rating-value" value="">
        <input type="text" name="bus_id" id="bus_id" placeholder="Enter Bus ID"
          style="margin: 10px 0; padding: 8px; width: 100%;" onmouseout="validateBusId()">
        <div class="textarea">
          <textarea cols="30" name="comment" id="comment" placeholder="Describe your experience..." onmouseout="validateComment()"></textarea>
        </div>
        <div class="btn">
          <button type="submit">Post</button>
        </div>
      </form>
    </div>
  </div>
  <div id="footer-placeholder"></div>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script>
    const btn = document.querySelector("button");
    const post = document.querySelector(".post");
    const widget = document.querySelector(".star-widget");
    const editBtn = document.querySelector(".edit");
    function validateRating() {
      const ratingInputs = document.querySelectorAll('input[name="rating"]');
      let ratingValue = "";
      ratingInputs.forEach(input => {
        if (input.checked) {
          ratingValue = input.value;
        }
      });
      if (ratingValue === "") {
        alert("Please select a star rating before posting.");
        return false;
      }
      document.getElementById('rating-value').value = ratingValue; 
      return true;
    }
    function validateBusId() {
      const busId = document.getElementById("bus_id").value.trim();
      if (busId === "" || isNaN(busId)) {
        alert("Please enter a valid numeric Bus ID for the trip you are rating.");
        document.getElementById("bus_id").focus();
        return false;
      }
      return true;
    }
    function validateComment() {
      const comment = document.getElementById("comment").value.trim();
      if (comment.length < 5) {
        alert("Please provide a brief comment describing your experience (at least 5 characters).");
        document.getElementById("comment").focus();
        return false;
      }
      return true;
    }
    function validateForm() {
      if (!validateRating()) return false;
      if (!validateBusId()) return false;
      if (!validateComment()) return false;
      widget.style.display = "none";
      post.style.display = "block";
      editBtn.onclick = () => {
        widget.style.display = "block";
        post.style.display = "none";
      };
      return true; 
    }
  </script>
</body>
</html>
