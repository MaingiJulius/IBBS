<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wema Travellers - Sign up</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/entry-page.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script src="js/header1.js"></script>
    <script src="js/footer.js"></script>
    <div class="row height-full">
        <div class="left-column flex flex-column height-full justify-center items-center">
            <h1 class="welcoming-title">Create Account</h1>
            <form class="form" id="signupForm" action="account2.php" method="POST" autocomplete="off" onsubmit="return validateForm()">
                <label for="first_name" class="label">First Name</label>
                <input type="text" name="first_name" id="first_name" class="input" onmouseout="validateFirstName();">
                <label for="last_name" class="label">Last Name</label>
                <input type="text" name="last_name" id="last_name" class="input" onmouseout="validateLastName();">
                <label for="email" class="label">Email</label>
                <input type="text" name="email" id="email" class="input" onmouseout="validateEmail();">
                <label for="phone_number" class="label">Phone Number</label>
                <input type="text" name="phone_number" id="phone_number" class="input" placeholder="e.g. 0712345678" onmouseout="validatePhoneNumber();">
                <label for="password" class="label">Password</label>
                <input type="password" name="password" id="password" class="input" onmouseout="validatePassword();">
                <p style="font-size: 0.85rem; color: gray; margin-bottom: 1rem;">Min 8 characters required.</p>
                <button type="submit" name="save" class="button regular-button pink-background cta-btn">Sign up</button>
            </form>
            <script>
                function validateFirstName() {
                    var fname = document.getElementById("first_name").value.trim();
                    if (fname == "") {
                        alert("First Name is required");
                        document.getElementById("first_name").focus();
                        return false;
                    }
                    return true;
                }
                function validateLastName() {
                    var lname = document.getElementById("last_name").value.trim();
                    if (lname == "") {
                        alert("Last Name is required");
                        document.getElementById("last_name").focus();
                        return false;
                    }
                    return true;
                }
                function validateEmail() {
                    var email = document.getElementById("email").value;
                    if (email.length == 0 || email.indexOf("@") == -1 || email.indexOf(".") == -1) {
                        alert("Please enter a valid email address");
                        document.getElementById("email").focus();
                        return false;
                    }
                    return true;
                }
                function validatePhoneNumber() {
                    var phone = document.getElementById("phone_number").value.trim();
                    if (phone.length < 9 || isNaN(phone)) {
                        alert("Please enter a valid phone number (numeric only)");
                        document.getElementById("phone_number").focus();
                        return false;
                    }
                    return true;
                }
                function validatePassword() {
                    var password = document.getElementById("password").value;
                    if (password.length < 8) {
                        alert("Password must be at least 8 characters long");
                        document.getElementById("password").focus();
                        return false;
                    }
                    return true;
                }
                function validateForm() {
                    var ok = validateFirstName();
                    if (ok == true) ok = validateLastName();
                    if (ok == true) ok = validateEmail();
                    if (ok == true) ok = validatePhoneNumber();
                    if (ok == true) ok = validatePassword();
                    return ok;
                }
            </script>
            <p class="login-prompt">Already have an account? <a href="./login.html" class="log-in-link">Log in</a></p>
        </div>
        <div class="right-column"></div>
    </div>
</body>
</html>
