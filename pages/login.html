<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wema Travellers - Login</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/entry-page.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script src="js/header1.js"></script>
    <script src="js/footer.js"></script>
    <div class="row height-full">
        <div class="left-column flex flex-column height-full justify-center items-center">
            <h1 class="welcoming-title">Welcome back</h1>
            <form class="form" id="loginForm" action="account2.php" method="POST" autocomplete="off" onsubmit="return validateForm()">
                <label for="email" class="label">Email</label>
                <input type="text" name="email" id="email" class="input" onmouseout="validateEmail();">
                <label for="password" class="label">Password</label>
                <input type="password" name="password" id="password" class="input" onmouseout="validatePassword();">
                <button type="submit" name="login" class="button regular-button pink-background cta-btn">Log in</button>
            </form>
            <script>
                function validateEmail() {
                    var email = document.getElementById("email").value;
                    if (email.length == 0 || email.indexOf("@") == -1 || email.indexOf(".") == -1) {
                        alert("You must enter a valid email address");
                        document.getElementById("email").focus();
                        return false;
                    }
                    return true;
                }
                function validatePassword() {
                    var password = document.getElementById("password").value;
                    if (password.length == 0) {
                        alert("Password cannot be empty");
                        document.getElementById("password").focus();
                        return false;
                    }
                    return true;
                }
                function validateForm() {
                    var rtned = validateEmail();
                    if (rtned == true) {
                        rtned = validatePassword();
                    }
                    return rtned;
                }
            </script>
            <p class="sign-up-prompt">Don't have an account? <a href="./signup.html" class="sign-up-link">Sign up</a></p>
        </div>
        <div class="right-column"></div>
    </div>
</body>
</html>
